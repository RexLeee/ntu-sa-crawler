# All tunable parameters live here. Code must never hardcode these values.

[identity]
bot_name = "ntu-sa-crawler"
# Contact info lets site owners reach us instead of blocking or filing an abuse
# report. The repo is private, so give an address that actually reaches someone
# rather than a URL that 404s.
user_agent = "ntu-sa-crawler/1.0 (NTU IM academic course project; contact: r14725023@ntu.edu.tw)"

[politeness]
# 0.2 qps per registered domain is a 5.0s gap. This is the delay Scrapy's own
# per-slot timer applies, and crawler/downloader.py is what makes it hold.
#
# Scrapy spaces the POPS from a slot's queue, not the requests: _process_queue
# writes slot.lastseen when it pops, then hands the download to the event
# loop, which runs it whenever it gets there. A measured 20 minute run held
# the reactor thread at 95-98% CPU with a 0.5s timer firing 1.3-4.6s late at
# the median, so the pop-to-pop interval said almost nothing about the
# interval the server saw. Earlier attempts to fix that with margin failed for
# the same reason: at 5.5s the jitter tail (p50 36ms, p99 302ms, max 559ms)
# still produced a 4.941s gap.
#
# crawler/downloader.py advances slot.lastseen at the previous response's
# COMPLETION instead. Every step then points the same way:
#
#   pop(B) >= complete(A) + delay >= wire(A) + delay, and wire(B) >= pop(B)
#
# so reactor lateness can only widen the gap. This is Heritrix's min-delay-ms
# and Nutch's FetchItemQueue semantics. 5.1 rather than 5.0 is clock-rounding
# margin only; compliance no longer depends on it.
download_delay = 5.1
# The floor the guard in crawler/dispatch.py refuses below, and the value
# ops/verify_politeness.py checks against. Under the design above a dispatch
# closer than this is impossible, so the guard firing means a defect: it drops
# the page and counts dispatch/guard_refused, which the smoke acceptance list
# requires to be 0.
required_min_gap = 5.0
# Scrapy randomizes delay to 0.5x-1.5x by default, which would produce 2.5s gaps.
# Must stay 0 or we violate the rate limit.
download_delay_jitter = 0.0
# 1 is load-bearing rather than a tuning knob. It is what keeps a second
# request for one domain from being popped while the first is still
# transferring, and that is what makes the completion-anchored delay a
# guarantee: two requests for one domain are never in flight together, so
# there is no ordering between them to get wrong.
concurrent_requests_per_domain = 1
# Dump the request and the previous dispatch whenever two dispatches on one
# domain land closer than required_min_gap. Such a dispatch is also refused.
# The file has to be 0 bytes for the run to be accepted, so it is read as
# proof: an entry means the guard caught something the design says cannot
# happen. Two dict operations per dispatch, and it writes nothing unless a gap
# is short, so it stays on for the whole 48 hours.
trace_short_gaps = true
obey_robotstxt = true
# Treat eTLD+1 as the politeness unit. Includes PSL private domains, so
# foo.blogspot.com and bar.blogspot.com count as separate domains.
include_psl_private_domains = true
# Record every dispatch to data/dispatched.log.gz, not only the fetches that
# reach parse(). This is what the compliance claim rests on.
#
# data/crawled.log.gz is written from parse(), so it holds successful HTML
# fetches only. It omits every failed request and every robots.txt fetch, and
# both consumed a real turn on the domain's timer. In one measured run 40,957
# of 45,825 robots fetches timed out, so the majority of what the crawler sent
# was invisible to ops/verify_politeness.py.
#
# At ~9M requests over 48 hours this costs about 1 GB compressed, using the
# same 10.79 bytes/line the discovered log measures.
log_dispatches = true
# Ceiling on a robots.txt Crawl-delay. Above this we knowingly under-honour:
# one domain at 600s would hold frontier capacity for the whole run and return
# 288 pages. A value inside the cap is applied to slot.delay and so gets the
# same completion-anchored guarantee the 5.0s rule has.
#
# 60.0 also matters for slot collection. Downloader._slot_gc drops a slot
# after 60s idle, which would lose its raised delay; capping Crawl-delay at
# 60s means a rebuilt slot's first request is already at least that long
# after the domain's last one.
max_crawl_delay = 60.0

[crawl]
# Not "how many downloads run at once". Downloader.active counts a request
# from the moment it is queued, including the up-to-5s wait on its domain
# timer, so this is really the budget for "requests parked on a domain
# timer" and therefore caps the number of domains in flight:
#
#     pages/sec <= distinct domains in active / download_delay
#
# At 200 a measured run held only ~57 distinct domains and managed
# 3.82 pages/s. A parked request holds no socket and costs ~3 KB, so 12000
# costs about 36 MB.
#
# Per process, and it does NOT divide by the shard count. A sharded run that
# kept 3000 here was slower than one process, 45.7 pages/s against 54.5: every
# shard sat at exactly 3000 active with only ~1,400 domain slots, while the
# single process spread the same 3000 over 6,551. A shard owns a fraction of
# the domains, so the budget gets spent stacking requests on the few it holds
# and runs out before the domains do. Raising it to 12000 recovered 52.29.
#
# 3000 is right for the single process this runs as. Raise it when sharding.
concurrent_requests = 3000
download_timeout = 10
# Scrapy's default is 60s with no negative cache (see the TODO in
# scrapy/resolver.py). Lookups run in the reactor thread pool, so one dead
# domain holds a thread for a full minute. In the measured run 2,118 DNS
# failures consumed 48% of the entire pool.
dns_timeout = 5
# A 10 minute run cached 26,344 entries; a 2 hour run reached 140,567. Per
# process, so divide it before sharding.
dns_cache_size = 200_000
# DNS lookups all run here, so the pool size caps the new-domain rate. Per
# process: 4 shards is 800 threads, which are almost all blocked on the
# network rather than running.
reactor_threadpool_maxsize = 200
# Bytes of response body waiting to be parsed before the engine stops
# dispatching. Scrapy defaults to 5 MB, which is ~62 average pages and starts
# throttling above roughly 60 pages/s.
#
# 100 MB was too generous. A measured run took 13.65s at the median from
# dispatch to parse, against a 10s download timeout, because responses sat in
# this queue. A deep queue only adds latency and memory; it never adds
# throughput, since the parser is the thing that is behind.
scraper_slot_max_active_size = 33554432   # 32 MB
download_maxsize = 524288        # 512 KB; large pages rarely carry more links
# 0, not 1. DownloaderAwarePriorityQueue picks the next slot purely by active
# download count and never reads request priority, so DEPTH_PRIORITY cannot
# affect the order domains are visited in. Within one domain a FIFO queue is
# already breadth-first. All a positive value did was split each domain's
# queue across several priority buckets: 3,430 domains produced 7,569 queue
# directories and 15,422 open file descriptors, two per queue.
depth_priority = 0
# How many domains crawler/pqueue.py may look at before it settles for the
# least busy one it saw. It normally stops far sooner: it stops at the first
# domain with no active download, and a skipped domain rotates to the back, so
# the expected scan is close to 1. The cap only bounds the pathological case
# where every domain in the ring is busy.
#
# Scrapy's own queue scans every domain on every pop. At the ~5,000 per-domain
# queues this crawl holds, a profile put that at 52% of all CPU against 5% for
# parse().
pqueue_scan_limit = 256
# INFO wrote 474 MB in 28 minutes, which extrapolates to ~48 GB over the full
# run. Almost all of it is one line per fetch plus a stack trace per failure,
# and neither is needed: data/crawled.log.gz already records every fetch, and
# the failure counts come from the stats dump.
#
# WARNING alone was not enough. Scrapy logs every download failure at ERROR
# with a full traceback, and a broad crawl fails constantly: 94,658 ERROR
# records inside a 495 MB log. crawler/logformatter.py demotes those to DEBUG.
log_level = "WARNING"
# How often crawler/extensions/runstats.py samples the internals that decide
# whether this design survives 48 hours: main-thread CPU, reactor lag, the
# scraper queue, and the per-domain queue count that pop() cost scales with.
runstats_interval = 30
# Type histogram of live objects. RSS alone cannot separate a real working set
# from allocator fragmentation; flat counts against rising RSS mean the latter.
runstats_objects_interval = 600
# The telnet console is useful for inspecting a live crawl, but connecting to
# it during a run injected AlreadyNegotiating errors into the log. Off unless
# a specific investigation needs it.
telnet_console = false
retry_enabled = false
cookies_enabled = false
redirect_enabled = true
redirect_max_times = 2
# Scrapy enables meta refresh by default. MetaRefreshMiddleware builds the
# target with source_request.replace(), which copies meta wholesale: the
# target inherited the source domain's download_slot and its dont_filter flag.
# That produced six politeness violations and dozens of double fetches in a 10
# minute run. crawler/downloader.py now derives the slot from the URL, so this
# would be compliant either way; off because a broad crawl gains nothing from
# following a refresh that a normal link would also expose.
follow_meta_refresh = false

[sharding]
# Number of crawler processes. Each owns a disjoint set of domains, chosen by
# crawler/slot.shard_of, so the 5 second per-domain timer never spans
# processes and needs no shared state. That is the whole reason sharding is
# safe here.
#
# 2, because the bottleneck moved. The earlier answer here was 1: four shards
# reached 52.29 pages/s against 54.54 for a single process, and the conclusion
# drawn was "the limit is the network, not the CPU". That measurement was
# taken on the WSL host, whose Wi-Fi link the crawl had already saturated to
# 72%. Four processes were contending for a link that was already full.
#
# On t2d-standard-2 the link is not the constraint. Measured: 12.0 Mbps used
# against 1,570 Mbps available, 0.8%. The condition the note below states,
# "it will only help if the link stops being the bottleneck", now holds.
#
# The reactor is the constraint instead, and the evidence is three-fold:
# proc_cpu_pct 100.5% where two dedicated cores would allow 200%, main_cpu_pct
# 99.5% inside that, and reactor lag at a 2,631 ms median against the 5.0s
# per-domain gap the timer has to hit.
#
# Domain supply is not the constraint either, which is the measurement that
# rules out the remaining explanation. pages/sec <= dl_slots / download_delay,
# and dl_slots reached 8,783 by the end of a ten minute run: a ceiling of
# 1,757 pages/s against the 25.52 actually achieved, 1.5% of it. The domains
# were there and the reactor could not dispatch them.
#
# Raising this is safe for compliance at any value, since each domain belongs
# to exactly one process. Verified at 0 violations across four processes.
#
# Every limit in [memory] is per process, so they are sized for one shard's
# share and total RSS is what has to clear the 7.9 GB this machine has.
#
# Measured at 2, against the single process on the same machine: 53.09 pages/s
# against 25.51, 2.08x, for 1.60x the memory. Both shards held 97-98% CPU for
# the whole run, so the second core is genuinely working. Response rate rose
# slightly, 79.6% against 77.9%, which is the opposite of the WSL result where
# four shards dropped it from 48% to 28% by contending for a full link.
#
# Sharding never caused a violation, and the earlier note here that said it
# did was wrong about the mechanism. Two short gaps were recorded on sharded
# runs, 2.604s and 0.000520s, and both came from the old dispatch timer: two
# coroutines for one domain could sleep at once, and asyncio.sleep is a lower
# bound, so the one that claimed the later turn could wake first. That is a
# single-process race which sharding only made more likely by raising the
# tail of the reactor lag. crawler/downloader.py removed it by anchoring the
# delay to the previous response's completion, which no lateness can shorten.
shards = 2
# How often each process drains the URLs other shards handed it. The poll is a
# few file reads, and a URL waiting here is a domain not yet being crawled, so
# this is short.
handoff_poll_interval = 5.0
# Ceiling on URLs admitted per poll. This runs on the reactor thread, so an
# unbounded inbox would block every download while it drained.
handoff_batch_max = 5000

[limits]
# A single domain can yield at most 34560 pages in 48h anyway (1 per 5s).
# Capping it frees frontier capacity for new domains, which is the real lever.
max_crawled_per_domain = 5000
# Counts requests currently waiting in the frontier, and is released when each
# one settles. It was previously never decremented, so a domain reaching this
# number went silent for the rest of the run even for pages it never fetched.
#
# 500, not 5000. One domain drains at 0.2 qps, so 500 queued pages is already
# 42 minutes of work for it. Anything beyond that is frontier capacity and
# disk held for a domain that cannot use it, taken from domains we have not
# discovered yet.
max_queued_per_domain = 500

[filters]
max_url_length = 2048
max_query_params = 5
max_path_depth = 8
skip_extensions = [
    "jpg", "jpeg", "png", "gif", "webp", "svg", "ico", "bmp", "tiff",
    "pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "odt",
    "zip", "gz", "tar", "bz2", "7z", "rar", "xz",
    "mp3", "mp4", "avi", "mkv", "mov", "wmv", "flv", "wav", "ogg", "webm",
    "css", "js", "json", "xml", "rss", "atom",
    "exe", "dmg", "iso", "apk", "deb", "rpm",
    "woff", "woff2", "ttf", "eot", "otf",
]
# Session ids explode the URL space without yielding new content.
skip_query_keys = ["sessionid", "phpsessid", "jsessionid", "sid", "sessid", "session_id"]

[memory]
# A measured hour: 40,773 pages crawled, 1.4M URLs discovered, RSS rising
# 1.6 MB/s with a linear fit (R^2 0.97) and no sign of flattening. The
# frontier fills about 33x faster than a 0.2 qps drain rate empties it, so
# every one of these is a ceiling rather than a tuning knob.
#
# EVERY VALUE HERE IS PER PROCESS, so raising sharding.shards above 1 means
# the machine holds that many copies of each. They are sized for the single
# process the crawl currently runs as; divide them before sharding.

# Sized for the whole 48 hours, not the current count. Past capacity the
# false positive rate climbs sharply. 50M costs about 171 MB.
bloom_capacity = 50_000_000
# One wrongly dropped URL per million. At 50M that is ~50 URLs never fetched,
# which is acceptable when the metric is aggregate volume.
bloom_error_rate = 1e-6
# Nothing in Scrapy caps the queue, so this is enforced by a scheduler
# subclass. Dropped URLs are not marked as seen and can return later.
#
# Raised from 2M. The frontier lives on disk under JOBDIR, so the cost is not
# memory: a measured run held 930k requests in 610 MB, about 660 bytes each.
# At 2M the cap was reached in roughly an hour, and after that every new URL
# was dropped, including the first URL of an unseen domain. That is the one
# thing we cannot afford to drop, so CappedScheduler now exempts it as well.
#
# 10M, not 20M. PER PROCESS, and that is what forced the change: at shards = 2
# the machine holds two frontiers, so 20M each is 20M x 660 B x 2 = 26.4 GB.
# The disk budget in ops/GCP_SETUP.md counted it once and arrived at 35 GB of
# the 60 GB disk; counting it twice puts the total at 47 GB with no margin for
# the logs the run is actually being kept for. At 10M the ceiling is 13.2 GB
# total and the budget lands near 34 GB.
#
# Reaching the cap is not the failure mode it was. The frontier fills about
# 33x faster than it drains, so the cap is reached either way; what matters is
# that a new domain's first URL is exempt, which it is.
frontier_max_size = 10_000_000
# Hard stop below the 7.9 GB the t2d-standard-2 has. It has to stay below
# physical RAM or it is not a guard at all: the OOM killer would SIGKILL the
# process before Scrapy's MemoryUsage extension noticed, losing the log flush
# and the persisted dupefilter.
#
# PER PROCESS, which is what sizes it: at shards = 2 the machine holds two of
# these, so the number that has to clear 7.9 GB is twice what is written here.
# 6000 was right for one process and became unsafe the moment the second one
# started, because 12000 is above physical RAM and the guard would never fire.
#
# Sized against a measured slope, not a peak. The growth is one bounded cache
# filling, not a leak. A 20 minute two-shard run tracked RSS against
# robots_cached exactly: 1,274 hosts at 695 MB, 19,263 at 2,216 MB, 38,313 at
# 2,563 MB, 45,786 at 2,647 MB. The marginal cost per newly cached host fell
# 82 -> 50 -> 20 -> 18 -> 1.3 KB across the run, and the last 236 seconds
# added 5,404 hosts for 7 MB. Extrapolating the remaining 4,214 hosts to the
# 50,000 ceiling puts a settled process near 2,800 MB.
#
# 3400, not 3000. Two things forced the change.
#
# First, MemoryUsage reads resource.getrusage().ru_maxrss, which is the PEAK
# RSS ever reached, not the current one. A single transient spike therefore
# trips the limit permanently: no later collection can bring the reading back
# down. Margin has to cover spikes, not just the settled level.
#
# Second, the measured peaks were 2,724 and 2,809 MB against a 3000 limit, so
# shard 1 had 191 MB left, and memusage/warning_reached was already 1 on both
# shards inside 20 minutes.
#
# 3400 x 2 = 6800 MB against 7,934 MB physical, leaving ~1.1 GB for the kernel
# and the page cache, and ~600 MB per process above the projection. Staying
# under physical RAM is what matters: hitting THIS limit closes the spider
# cleanly, via the same close path as the timed shutdown, so the logs, the
# Bloom filter and the stats all survive. Hitting physical RAM instead means
# the OOM killer SIGKILLs the process and all of that is lost. The cost of a
# clean stop is one shard's share of the remaining hours, which is expensive
# but not corrupting.
memusage_limit_mb = 3400
# Python's cyclic collector walks every tracked container object on a gen-2
# pass. This process holds a lot of them: objects-0.log recorded 848,879
# protego _Rule plus 848,879 _URLPattern at the end of a 20 minute run, 1.7M
# objects in two types alone. Every gen-2 pass is a stop-the-world pause on
# the reactor thread, which is the thread the per-domain timers live on.
#
# 5_000, not 50_000, and the difference was measured rather than reasoned.
#
# 50_000 raised throughput 25% and cost 640 MB per shard, which is the wrong
# trade on a 7.9 GB machine with a 3000 MB per-process limit. A 20 minute run
# ended at 2,686 and 2,778 MB against that limit, leaving 222 MB. The same run
# at the default threshold ended at 1,980 and 2,204 MB.
#
# The object dumps say where it went. Against the earlier run at the same
# elapsed time: frame 39,117 -> 219,579 and traceback 21,837 -> 121,014, both
# 5.6x. Those are reference cycles that only the collector frees, and a broad
# crawl manufactures them constantly because every failed request builds a
# traceback. Raising threshold0 by 71x let 71x as many accumulate.
#
# 5_000 is 7x the default, so gen-0 still runs 7x less often, but the cycle
# backlog stays bounded. Verify on the next run that per-shard RSS settles
# below 2,500 MB and that lag_p50 stays under the 2,269 ms the default
# produced.
#
# Compliance does not depend on this. The completion-anchored delay holds
# through any pause; this is throughput and memory only. runstats records
# gc_max_ms and gc_total_ms so the effect stays measured.
gc_threshold0 = 5_000
# Move everything alive at spider_opened into the permanent generation, so
# gen-2 passes stop traversing the interpreter, Scrapy and the imported
# libraries. Only the objects the crawl itself creates afterwards are walked.
gc_freeze_at_start = true
# 3000, not 2500. The projected settled level is ~2,800 MB, so a 2500 warning
# fires on every healthy run: both shards had memusage/warning_reached = 1
# inside 20 minutes. A warning that always fires carries no information.
#
# 3000 sits above the projection and 400 MB below the limit, so it fires only
# when a run is genuinely heading for the hard stop. It is a real signal: the
# memusage_warning_reached stat is the only advance notice that a shard is
# about to close itself.
memusage_warning_mb = 3000
# Scrapy keeps every robots.txt parser it ever builds, keyed by hostname, and
# never evicts. Measured: 0.9 KB for a one-rule file, 7.1 KB for a typical
# one, 369 KB for a 500-rule one. That dict was the main driver of the
# 5.3 GB RSS seen in an 87 minute run. Evicting only costs a re-fetch; the
# robots check itself is never skipped.
robots_cache_size = 50_000
# What to do when robots.txt cannot be read at all. Scrapy's convention, and
# the usual one, is to treat an unreadable file as permission to crawl
# everything. The assignment says "NO violation", and the difference is not
# theoretical: a 2 hour run fetched two URLs under Disallow: /reports/ and
# Disallow: /survey on www.eia.gov because a transient failure had cached
# "unknown" for that host. Refusing costs pages on hosts we cannot read.
robots_strict_on_failure = true
# How long an unreadable robots.txt stays unreadable before we try again.
# Without this, one timeout during a traffic spike would silence a host for
# the rest of the 48 hours.
robots_failure_ttl = 300.0

[paths]
data_dir = "data"
state_dir = "state"
# Without this the disk queue is inert and the whole frontier stays in RAM.
jobdir = "state/job"

[seeds]
# The assignment allows 1000. Each one opens an independent 5 second pipeline,
# so the count and the domain diversity both matter. Built by
# seeds/build_seeds.py from Tranco and verified by seeds/probe.py.
seeds_file = "seeds/seeds_1000.txt"

[test]
# 20 hand-picked URLs, used by the smoke run only.
seeds_file = "tests/seeds_smoke.txt"
timeout_seconds = 600
